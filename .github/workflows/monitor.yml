name: Crypto Signal Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state (evita alertas repetidas)
        uses: actions/cache@v4
        with:
          path: state.json
          key: crypto-monitor-state
          restore-keys: crypto-monitor-state

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVAL: '15m'
          RSI_PERIOD: '14'
          MA_FAST: '9'
          MA_SLOW: '21'
          RSI_LOW: '30'
          RSI_HIGH: '70'
          HTF_INTERVAL: '4h'
          HTF_SMA_PERIOD: '50'
          REQUIRE_VOLUME: 'true'
          REQUIRE_HTF_TREND: 'true'
        run: python crypto_monitor.py
