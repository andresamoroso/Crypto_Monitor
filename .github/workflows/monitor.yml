name: Crypto Signal Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Sistema 1: zona de giro (15m)
          REVERSAL_INTERVAL: '15m'
          RSI_PERIOD: '14'
          RSI_LOW: '30'
          RSI_HIGH: '70'
          BB_PERIOD: '20'
          BB_STD: '2.0'
          VOLUME_LOOKBACK: '20'
          VOLUME_MULTIPLIER: '1.5'
          # Sistema 2: estado de tendencia (4h + 1d)
          TREND_INTERVAL: '4h'
          DAILY_INTERVAL: '1d'
          MA_FAST: '9'
          MA_SLOW: '21'
          ATR_PERIOD: '14'
          MOMENTUM_LOOKBACK: '10'
          MOMENTUM_ATR_MULTIPLIER: '1.5'
          USE_DAILY_CONFIRMATION: 'true'
          DAILY_SMA: '50'
          # Paper-testing
          TARGET_ATR_MULT: '1.5'
          STOP_ATR_MULT: '1.0'
          HORIZON_CANDLES: '4'
          NOTIFY_ON_RESOLUTION: 'true'
          SUMMARY_INTERVAL_HOURS: '24'
        run: python crypto_monitor.py

      - name: Guardar estado y registro de señales en el repo
        run: |
          git config user.name "crypto-signal-bot"
          git config user.email "actions@github.com"
          git add state.json signals_log.jsonl
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualiza estado y registro de señales [skip ci]"
            git pull --rebase
            git push
          fi
