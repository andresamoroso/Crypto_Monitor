name: Crypto Checkpoint Report

on:
  schedule:
    - cron: '0 9 1,15 * *'
  workflow_dispatch: {}

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checkpoint report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SAMPLES_FOR_FLAGS: '8'
          NEWS_CORRELATION_WINDOW_HOURS: '6'
        run: python crypto_checkpoint_report.py
